<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Odyssey</title>
    <script>
      // GitHub Pages has no server-side router, so a deep link (e.g. /Odyssey/donate)
      // 404s here on refresh. Re-encode the path as a query string and redirect to
      // the app root, which decodes it back in index.html before React Router mounts.
      var segmentsToKeep = 1 // "/Odyssey" — the project-pages base path
      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/") +
          "/?p=/" +
          l.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
